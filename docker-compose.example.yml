# =====================================================================
# 觅影（mivying）PanSou 网盘搜索 + portal 门脸 部署示例
# 复制为 docker-compose.yml 后，把所有 <...> / change-me 占位改成真实值。
# 真实的 docker-compose.yml 含密钥，已被 .gitignore 排除，请勿提交。
# =====================================================================
services:
  pansou:
    image: ghcr.io/fish2018/pansou-web:latest
    container_name: pansou
    restart: unless-stopped
    ports:
      - "8980:80"
    environment:
      # 上游 PanSou 访问 Telegram 频道的代理（如本机/旁路由 Clash 的 socks5）
      - PROXY=socks5://<代理用户名>:<代理密码>@<旁路由IP>:7891
      # 订阅的 Telegram 频道逗号分隔（2026-11-13 生产在用 41 个，均为公开频道，可按需删减）
      - CHANNELS=tgsearchers7,Baidu_netdisk,bdwpzhpd,baidyunpan,rbzhwpzy,bdbdndn11,jdjdn1111,BaiduCloudDisk,Aliyun_4K_Movies,dianying4k,MCPH02,MCPH03,Q66Share,gimy115iso,PikPak_Share_Channel,guoman4K,Netdisk_Movies,PanjClub,baicaoZY,gotopan,ciliziyuanku,yp123pan,xx123pan,yingshifenxiang123,Lsp115,Channel_Shares_115,vip115hot,ucwpzy,ucquark,yunpanuc,yunpanxunlei,XunLeiPinDao,tianyifc,yunpan189,shareAliyun,Quark_Movies,Oscar_4Kmovies,MCPH01,cilidianying,Q_dongman,yoyokuakeduanju
      # 第三方资源站插件白名单：2026-11-13 对上游 113 个插件全量灰度实测后精选的 28 个存活源（含 5 个 BT/磁力源）。
      # 第三方站点会周期性失效，后续请以 PanSou 上游 plugin 目录实测为准增删，勿盲目全开。
      - ENABLED_PLUGINS=zhizhen,shandian,duoduo,muou,xiaokupan,aipan,haitunsou,quark4k,xiaozhang,yunso,btbtlb,clmao,5266ys,dygang,lou1,miosou,nyaa,melost,xiaoyu,yingso,ikantv,huban,erxiaopan,hjzhencai,meitizy,kkv,libvio,jutoushe
      - CACHE_ENABLED=true
      - CACHE_TTL=60
      - MAX_CONCURRENCY=40
      # 异步快速响应窗口（秒）：调大可让慢网盘源赶上首轮，代价是冷查尾部延迟略增；TG 频道软截止单独控制
      - ASYNC_RESPONSE_TIMEOUT=5
      - TG_CHANNEL_TIMEOUT_SECONDS=2
      # PanSou 自身认证关闭（认证由 portal 长效令牌负责）
      - AUTH_ENABLED=false
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 前置门脸：长效登录 + 服务端历史/收藏（跨设备）+ 失效链接过滤 + 用量统计/滥用告警
  pansou-portal:
    build: ./portal
    image: pansou-portal:latest
    container_name: pansou-portal
    restart: unless-stopped
    depends_on:
      - pansou
    ports:
      - "8981:80"
    environment:
      - PANSOU_UPSTREAM=http://pansou
      - DB_PATH=/app/data/portal.db
      - ADMIN_USER=admin
      # 账号清单（user:pass，逗号分隔；增删账号改这一行）。务必改成强密码。
      - AUTH_USERS=admin:change-me-admin-password,user2:change-me-user-password
      # portal 自签 JWT 密钥：用 `openssl rand -hex 32` 生成，至少 32 位，切勿提交
      - JWT_SECRET=change-me-generate-with-openssl-rand-hex-32
      # 长效令牌有效期（天）：180≈半年；想永久可改 3650
      - TOKEN_TTL_DAYS=180
      # 滥用告警：Bark 推送（iOS），填自己的设备 key；不需要可留空
      - BARK_KEY=
      # 海报图床回源代理（Telegram CDN 被墙时）；不需要可留空
      - POSTER_PROXY=
      # 频率阈值：近10分钟 >60 次 或 当日 >500 次 即告警（admin 账号豁免）
      - RATE_WINDOW_SEC=600
      - RATE_WINDOW_MAX=60
      - RATE_DAY_MAX=500
      # 同一 IP 告警冷却 15 分钟
      - ALERT_COOLDOWN_SEC=900
      # 事件明细保留 30 天
      - EVENT_KEEP_DAYS=30
      # 失效链接检测：搜索后同步验证前 N 条（每类网盘先保底），确认失效的隐藏
      - VERIFY_N=40
      - VERIFY_WORKERS=16
      - VERIFY_CACHE_TTL=1800
      - VERIFY_TIMEOUT=3
      # A：每个网盘类型保底验证条数；B：后台全量净化单次安全上限
      - VERIFY_PER_TYPE=8
      - VERIFY_BG_LIMIT=160
      # C：同版本指纹去重开关；来源健康度降权最小样本与系数下限
      - DEDUP_ENABLED=1
      - SOURCE_HEALTH_MIN=10
      - SOURCE_HEALTH_FLOOR=0.5
      # 方案一：查询改写/多路召回；主词唯一链接数低于阈值才触发，变体整体超时硬顶（秒）
      - QUERY_REWRITE_ENABLED=1
      - QUERY_VARIANT_MAX=5
      - QUERY_REWRITE_MIN_HITS=8
      - QUERY_VARIANT_TIMEOUT=8
      # 同义词召回（繁简/别号/中英译名，纯规则零依赖）；远程 MCP 开关与返回上限
      - SYNONYM_ENABLED=1
      - SYNONYM_ALIAS_MAX=2
      - MCP_ENABLED=1
      - MCP_RESULT_LIMIT=30
      # 混合 FTS5 预索引：搜索先查本地（约百毫秒），未命中再回源，后台异步回填
      - FTS_ENABLED=1
      - FTS_FILL_INTERVAL=21600
      - FTS_MIN_HITS=8
      - FTS_MAX_WORDS=30
      - FTS_MAX_ARTS_PER_WORD=60
      - FTS_QUERY_LIMIT=80
      # 日志级别（DEBUG/INFO/WARNING/ERROR）
      - LOG_LEVEL=INFO
      # SQLite 自动备份：启动一份 + 每日在线备份，仅保留最新 N 份
      - BACKUP_ENABLED=1
      - BACKUP_DIR=/app/data/backups
      - BACKUP_KEEP=7
      - BACKUP_INTERVAL_SEC=86400
      # 版本号（后台可观测面板/健康探针展示）
      - APP_VERSION=0.5.0
      # 上游熔断：连续失败 N 次打开，冷却 M 秒后半开试探；熔断期优先本地 FTS 兜底
      - CB_FAIL_THRESHOLD=5
      - CB_OPEN_SEC=30
      # 异常链接自动重试定性：间隔/上限/扫描周期/启动延迟/并发（留默认即可）
      - VERIFY_RETRY_MAX=3
      - VERIFY_RETRY_INTERVAL_SEC=180
      - VERIFY_RETRY_SCAN_SEC=60
      - VERIFY_RETRY_START_DELAY=120
      - VERIFY_RETRY_WORKERS=4
      # 登录安全 Bark 提醒：失败 N 次先预警（0 关闭，需小于锁定阈值 8）；新公网 IP 登录是否提醒
      - LOGIN_WARN_FAIL=3
      - LOGIN_IP_NOTIFY=1
      # 关键词 RSS：feed 内存缓存秒数 / 单 feed 最大条数 / 聚合 feed 最多跟踪的在看关键词数
      - RSS_CACHE_SEC=60
      - RSS_MAX_ITEMS=30
      - RSS_FEED_KEYWORDS_MAX=5
    volumes:
      - ./portal-data:/app/data
    mem_limit: 192m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    # 镜像为 python:3.12-slim（无 curl），用自带 python 探活；只反映门脸进程可响应
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/portal/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
