# 示例配置（仓库脱敏副本，非生产实配）：
# 将下方 example.com 替换为你的真实域名，并同步更换 SSL 证书文件路径后再部署；
# server_name 与证书文件名均为占位，请勿直接用于生产。
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/nginx/ssl/example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/pansou;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8980;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /portal/ {
        proxy_pass http://127.0.0.1:8980;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 隐藏文件（.git/.env/.DS_Store 等）直接 404，不落入 SPA fallback；保留 .well-known（ACME 证书验证）
    location ~ /\.(?!well-known) { return 404; }
    # 后端/备份/配置/数据类敏感后缀（本站仅托管单文件 index.html，这些不应被公开访问）
    location ~* \.(env|db|sqlite|sqlite3|bak|old|orig|conf|yml|yaml|ini|py|pyc|sh|log|sql)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        # 静态页面安全头（/api/ 与 /portal/ 的响应头由 portal 中间件统一添加）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://miaoda.feishu.cn; font-src 'self' https://sf3-scmcdn-cn.feishucdn.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
